<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#15120e" />
<meta name="robots" content="noindex" />
<title>Страница не найдена · Камилла SMM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315120e'/%3E%3Cpath d='M21 15v34M21 33.5 40 15M27 28.5 44 49' stroke='%23c4653c' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Onest:wght@300;400;500;600&family=Prata&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#f3efe7;--ink:#15120e;
  --d-strong:#f3efe7;--d-body:#b6ad9c;--d-mute:#867d6d;
  --brick:#9a4526;--brick-2:#c4653c;
  --d-line:rgba(243,239,231,.15);--d-line-2:rgba(243,239,231,.30);
  --ff-display:'Prata',Georgia,serif;--ff-italic:'Cormorant Garamond',Georgia,serif;
  --ff-ui:'Onest',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.12,.42,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--ink);-webkit-text-size-adjust:100%;}
body{
  font-family:var(--ff-ui);background:var(--ink);color:var(--d-body);line-height:1.65;font-size:16px;
  min-height:100svh;display:grid;place-items:center;padding:40px 20px;overflow-x:clip;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;position:relative;isolation:isolate;
}
body::before{
  content:"";position:fixed;top:-30%;right:-32%;width:min(120vw,780px);aspect-ratio:1;
  border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,rgba(154,69,38,.34),rgba(154,69,38,0) 66%);
}
::selection{background:var(--brick-2);color:var(--ink);}
main{max-width:560px;width:100%;}
.eyebrow{
  display:flex;align-items:center;gap:11px;margin-bottom:26px;
  font-size:10.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--d-mute);
  opacity:0;animation:fade .8s var(--ease) .15s forwards;
}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--brick-2);flex:none;}
.code{
  font-family:var(--ff-display);font-weight:400;font-size:clamp(96px,32vw,190px);line-height:.82;
  letter-spacing:-.045em;color:var(--d-strong);
  opacity:0;animation:rise 1.1s var(--ease) .25s forwards;
}
h1{
  font-family:var(--ff-display);font-weight:400;font-size:clamp(28px,8vw,42px);line-height:1.06;
  letter-spacing:-.02em;color:var(--d-strong);margin-top:26px;
  opacity:0;animation:rise 1.1s var(--ease) .4s forwards;
}
h1 em{font-family:var(--ff-italic);font-style:italic;font-weight:400;font-size:1.13em;color:var(--brick-2);}
p{color:var(--d-body);font-size:16px;margin-top:18px;max-width:38ch;
  opacity:0;animation:rise 1.1s var(--ease) .55s forwards;}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.btn{
  position:relative;overflow:hidden;isolation:isolate;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:32px;
  font-family:var(--ff-ui);font-weight:500;font-size:14px;text-decoration:none;
  color:var(--ink);background:var(--paper);padding:17px 26px;border-radius:100px;
  transition:transform .5s var(--spring),color .35s;
  opacity:0;animation:rise 1.1s var(--ease) .7s forwards;
}
.btn span,.btn svg{position:relative;z-index:1;}
.btn::before{content:"";position:absolute;inset:0;z-index:0;transform:translateY(101%);
  background:var(--brick-2);transition:transform .55s var(--ease);}
.btn svg{transition:transform .45s var(--spring);}
.btn:active{transform:scale(.97);}
@media(hover:hover){.btn:hover::before{transform:translateY(0)}.btn:hover{color:var(--paper)}.btn:hover svg{transform:translateX(4px)}}

.alt{
  margin-top:34px;padding-top:20px;border-top:1px solid var(--d-line);
  display:flex;gap:8px 22px;flex-wrap:wrap;font-size:13.5px;color:var(--d-mute);
  opacity:0;animation:fade .9s ease .9s forwards;
}
.alt a{color:var(--d-body);text-decoration:none;border-bottom:1px solid var(--d-line-2);padding-bottom:2px;
  transition:color .3s,border-color .3s;}
@media(hover:hover){.alt a:hover{color:var(--brick-2);border-color:var(--brick-2)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .eyebrow,.code,h1,p,.btn,.alt{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>

<main>
  <div class="eyebrow">Ошибка 404</div>
  <div class="code">404</div>
  <h1>Такой страницы <em>не существует</em></h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Но всё интересное — на главной.</p>
  <a class="btn" href="/">
    <span>Вернуться на главную</span>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <div class="alt">
    <a href="/#services">Услуги</a>
    <a href="/#case">Кейс</a>
    <a href="https://t.me/faalseee" target="_blank" rel="noopener">Написать в Telegram</a>
  </div>
</main>

</body>
</html>
